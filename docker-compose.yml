# Chạy trên VPS:  docker compose up -d --build
# Yêu cầu file .env ở cùng thư mục (DATA_BACKEND=google, COOKIE_SECURE=true, NODE_ENV=production).
services:
  api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      NODE_ENV: production
      LOCAL_STORAGE_DIR: /data
    volumes:
      - umbm_storage:/data
    restart: unless-stopped
    # Bắt buộc 1 instance: cache + hàng đợi ghi Google Sheets nằm trong process này.
    deploy: { replicas: 1 }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Đặt PUBLIC_HOST trong .env, ví dụ 34-123-45-67.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]
    restart: unless-stopped

volumes:
  umbm_storage:
  caddy_data:
